<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; height: 100vh; background: #ccc; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  .modal { background: white; max-height: 80vh; display: flex; flex-direction: column; width: 400px; overflow: hidden; border-radius: 10px; }
  .header { height: 50px; background: #eee; flex-shrink: 0; border-bottom: 1px solid #ccc; }
  .wizard { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .body { flex: 1; overflow-y: auto; min-height: 0; padding: 20px; }
  .footer { height: 50px; background: #fff; flex-shrink: 0; border-top: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
  .box { height: 80px; margin-bottom: 10px; border: 1px solid #000; border-radius: 5px; }
</style>
</head>
<body>
<div class="modal">
  <div class="header">ModalHeader</div>
  <div class="wizard">
    <div class="body">
      <h2>Extended Family</h2>
      <div class="box">Grandfather</div>
      <div class="box">Uncle</div>
      <div class="box">Cousin</div>
      <div class="box">Aunt</div>
      <div class="box">Nephew</div>
      <div class="box">Niece</div>
    </div>
    <div class="footer">
      <button>Cancel</button>
      <button>Next</button>
    </div>
  </div>
</div>
</body>
</html>
