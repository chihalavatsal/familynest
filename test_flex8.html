<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; height: 100vh; background: #ccc; display: flex; align-items: center; justify-content: center; gap: 20px;}
  
  .modal { 
    background: white; 
    max-height: 300px; /* restrict height */
    display: flex; 
    flex-direction: column; 
    width: 200px; 
    overflow: hidden;
  }
  
  .modal-tall { 
    background: white; 
    max-height: 900px; /* lots of space */
    display: flex; 
    flex-direction: column; 
    width: 200px;
    overflow: hidden; 
  }

  .header { height: 50px; background: #eee; flex-shrink: 0; }
  .footer { height: 50px; background: #ddd; flex-shrink: 0; }
  
  /* The magic wrapper and body */
  .wizard { display: flex; flex-direction: column; overflow: hidden; }
  .body { overflow-y: auto; padding: 20px; }
  
  .content { height: 600px; background: linear-gradient(to bottom, #faa, #aaf); }
</style>
</head>
<body>

<div class="modal">
  <div class="header">Restricted</div>
  <div class="wizard">
    <div class="body">
      <div class="content">Tall</div>
    </div>
    <div class="footer">Footer</div>
  </div>
</div>

<div class="modal-tall">
  <div class="header">Plenty Space</div>
  <div class="wizard">
    <div class="body">
      <div class="content">Tall</div>
    </div>
    <div class="footer">Footer</div>
  </div>
</div>

</body>
</html>
