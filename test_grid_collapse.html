<!DOCTYPE html>
<html>
<body>
<style>
  body { margin: 0; background: #ccc; padding: 20px;}
  
  .modal-grid { 
    background: white; 
    max-height: 300px;
    display: grid; 
    grid-template-rows: auto minmax(0, 1fr);
    width: 200px; 
    overflow: hidden;
  }
  
  .modal-grid-tall { 
    background: white; 
    max-height: 900px;
    display: grid; 
    grid-template-rows: auto minmax(0, 1fr);
    width: 200px;
    overflow: hidden; 
  }

  .header { height: 50px; background: #eee; }
  .footer { height: 50px; background: #ddd; }
  
  .wizard { display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }
  .body { overflow-y: auto; padding: 20px; }
  
  .content { height: 600px; background: linear-gradient(to bottom, #faa, #aaf); }
</style>

<div class="modal-grid" id="restricted">
  <div class="header">Restricted</div>
  <div class="wizard">
    <div class="body"><div class="content">Tall</div></div>
    <div class="footer">Footer</div>
  </div>
</div>

<div class="modal-grid-tall" id="tall">
  <div class="header">Plenty Space</div>
  <div class="wizard">
    <div class="body"><div class="content">Tall</div></div>
    <div class="footer">Footer</div>
  </div>
</div>

<script>
  document.write("<p>Restricted height: " + document.getElementById('restricted').offsetHeight + " (Expected: 300)</p>");
  document.write("<p>Tall height: " + document.getElementById('tall').offsetHeight + " (Expected: 740 = 50 + 40 padding + 600 + 50)</p>");
</script>
</body>
</html>
