<!DOCTYPE html>
<html>
<body>
<style>
  body { margin: 0; background: #ccc; padding: 20px;}
  
  .modal-tall { 
    background: white; 
    max-height: 900px;
    display: flex; 
    flex-direction: column;
    width: 200px;
    overflow: hidden; 
  }

  .header { height: 50px; background: #eee; flex-shrink: 0; }
  .footer { height: 50px; background: #ddd; flex-shrink: 0; }
  
  .wizard { display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; flex: 1 1 auto; min-height: 0;}
  .body { overflow-y: auto; padding: 20px; }
  
  .content { height: 600px; background: linear-gradient(to bottom, #faa, #aaf); }
</style>

<div class="modal-tall" id="tall">
  <div class="header">Plenty Space</div>
  <div class="wizard">
    <div class="body"><div class="content">Tall</div></div>
    <div class="footer">Footer</div>
  </div>
</div>

<script>
  document.write("<p>Tall height: " + document.getElementById('tall').offsetHeight + " (Expected: 740)</p>");
</script>
</body>
</html>
