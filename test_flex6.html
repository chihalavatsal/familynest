<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; height: 100vh; background: #ccc; display: flex; align-items: center; justify-content: center; gap: 20px;}
  .modal { background: white; max-height: 50vh; display: flex; flex-direction: column; width: 200px; }
  .header { height: 50px; background: #eee; flex-shrink: 0; }
  
  /* Flex-1 body */
  .wizard1 { display: flex; flex-direction: column; min-height: 0; }
  .body1 { flex: 1 1 0%; overflow-y: auto; min-height: 0; padding: 20px; }
  
  /* Flex-auto body */
  .wizard2 { display: flex; flex-direction: column; min-height: 0; }
  .body2 { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding: 20px; }

  .footer { height: 50px; background: #ddd; flex-shrink: 0; }
  .content { height: 600px; background: linear-gradient(to bottom, #faa, #aaf); }
</style>
</head>
<body>
<div class="modal">
  <div class="header">Header 1 (flex: 1)</div>
  <div class="wizard1">
    <div class="body1">
      <div class="content">Tall content</div>
    </div>
    <div class="footer">Footer</div>
  </div>
</div>

<div class="modal">
  <div class="header">Header 2 (flex: auto)</div>
  <div class="wizard2">
    <div class="body2">
      <div class="content">Tall content</div>
    </div>
    <div class="footer">Footer</div>
  </div>
</div>
</body>
</html>
