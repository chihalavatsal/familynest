# ==============================================================================
# FamilyNest Docker Compose Configuration
# 
# DATABASE ARCHITECTURE NOTE:
# The primary database for FamilyNest is Neon PostgreSQL (cloud serverless).
# The backend connects to Neon via the DATABASE_URL environment variable with SSL.
# The local PostgreSQL container is retained below as an optional, commented-out
# fallback/reference for offline development, but is NOT required.
# ==============================================================================

services:
  # Backend FastAPI Service (configured for Neon PostgreSQL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: familynest_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
    ports:
      - "8000:8000"
    networks:
      - familynest_network

  # Frontend Service (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: familynest_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - familynest_network

  # OPTIONAL / LOCAL POSTGRESQL FALLBACK ONLY
  # Uncomment only if developing completely offline without Neon.
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: familynest_postgres_local
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: familynest
  #     POSTGRES_USER: familynest_user
  #     POSTGRES_PASSWORD: familynest_dev_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - familynest_network

# volumes:
#   postgres_data:
#     driver: local

networks:
  familynest_network:
    driver: bridge
