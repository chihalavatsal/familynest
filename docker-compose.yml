services:
  postgres:
    image: postgres:16-alpine
    container_name: familynest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familynest}
      POSTGRES_USER: ${POSTGRES_USER:-familynest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familynest_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familynest_user} -d ${POSTGRES_DB:-familynest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - familynest_network

