<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; height: 100vh; background: #ccc; display: flex; align-items: center; justify-content: center; gap: 20px;}
  
  .modal-grid { 
    background: white; 
    max-height: 300px;
    display: grid; 
    grid-template-rows: auto minmax(0, 1fr) auto;
    width: 200px; 
    overflow: hidden;
  }
  
  .modal-grid-tall { 
    background: white; 
    max-height: 900px;
    display: grid; 
    grid-template-rows: auto minmax(0, 1fr) auto;
    width: 200px;
    overflow: hidden; 
  }

  .header { height: 50px; background: #eee; }
  .footer { height: 50px; background: #ddd; }
  
  .body { overflow-y: auto; padding: 20px; }
  
  .content { height: 600px; background: linear-gradient(to bottom, #faa, #aaf); }
</style>
</head>
<body>

<div class="modal-grid" id="restricted">
  <div class="header">Restricted</div>
  <div class="body">
    <div class="content">Tall</div>
  </div>
  <div class="footer">Footer</div>
</div>

<div class="modal-grid-tall" id="tall">
  <div class="header">Plenty Space</div>
  <div class="body">
    <div class="content">Tall</div>
  </div>
  <div class="footer">Footer</div>
</div>

<script>
  console.log("restricted: " + document.getElementById('restricted').offsetHeight);
  console.log("tall: " + document.getElementById('tall').offsetHeight);
</script>
</body>
</html>
